[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "praxis"
version = "0.1.0"
description = "Policy-driven AI workflow governance"
authors = [{ name = "jayers" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "questionary>=2.0.0",
]

[project.scripts]
praxis = "praxis.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-bdd>=8.0",
    "ruff>=0.8",
    "mypy>=1.0",
    "types-pyyaml>=6.0",
    "pre-commit>=4.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # Allow long lines in test fixtures

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["praxis"]
exclude = ["tests/", "examples/"]

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["examples.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
